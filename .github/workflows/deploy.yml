name: Update Data and Deploy to GitHub Pages

on:
  schedule:
    # Run daily around Finland lunchtime (~12:00 PM): 09:37 UTC (12:37 EEST / 11:37 EET)
    # Prime quiet window for GitHub Actions (US midnight) with :37 avoiding peak queue backlogs
    - cron: '37 9 * * *'
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run data update pipeline
        run: |
          chmod +x update.sh
          ./update.sh

      - name: Commit and push updated data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update model catalog & benchmarks [skip ci]"
            git push
          else
            echo "No data changes detected. Skipping git push."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Send Discord notification
        if: success() && env.DISCORD_WEBHOOK != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          REPO_NAME="${{ github.repository }}"
          OWNER_NAME="${{ github.repository_owner }}"
          DASHBOARD_URL="https://${OWNER_NAME}.github.io/${REPO_NAME#*/}/"

          PAYLOAD=$(cat <<EOF
          {
            "embeds": [{
              "title": "🚀 OpenCode Go & Free AI Models Updated!",
              "description": "Daily 24h benchmark & model catalog sync complete.",
              "url": "${DASHBOARD_URL}",
              "color": 14251863,
              "fields": [
                {
                  "name": "📊 Live Dashboard",
                  "value": "[Open Value Frontier & Free Catalog](${DASHBOARD_URL})",
                  "inline": false
                },
                {
                  "name": "🕒 Schedule",
                  "value": "Daily ~12:00 PM Finland time (09:37 UTC)",
                  "inline": true
                },
                {
                  "name": "📂 Repository",
                  "value": "${REPO_NAME}",
                  "inline": true
                }
              ],
              "footer": {
                "text": "100% Vibe-coded with AI • Antigravity & Gemini"
              }
            }]
          }
          EOF
          )

          curl -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$DISCORD_WEBHOOK" || echo "Discord notification failed (non-critical)"
