<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI News Feed · OpenCode · Providers · HN — 최신순</title>
<meta name="description" content="OpenCode 릴리스·changelog와 Hacker News를 합친 단일 최신순 AI 뉴스 피드.">
<style>
  :root {
    --page: #f8f6f2; --surface: #ffffff; --line: #e5e0d8; --line-subtle: #eeebe5;
    --wash: #f0ece3; --ink: #1a1917; --ink-2: #4a4742; --ink-3: #7d7871;
    --accent: #d97757; --accent-soft: rgba(217,119,87,.12); --accent-ink: #b24827;
    --green: #2e7d32; --green-soft: #e8f5e9; --blue: #1565c0; --blue-soft: #e3f2fd;
    --purple: #7b1fa2; --purple-soft: #f3e5f5;
    --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
    --font: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    --serif: "Lora", Georgia, serif;
  }
  [data-theme="dark"] {
    --page: #0d1117; --surface: #161b22; --line: #30363d; --line-subtle: #21262d; --wash: #1f242c;
    --ink: #f0f6fc; --ink-2: #8b949e; --ink-3: #6e7681;
    --accent: #f97316; --accent-soft: rgba(249,115,22,.18); --accent-ink: #fb923c;
    --green: #3fb950; --green-soft: rgba(63,185,80,.15); --blue: #58a6ff; --blue-soft: rgba(88,166,255,.15);
    --purple: #bc8cff; --purple-soft: rgba(188,140,255,.15);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.55; }
  a { color: var(--accent-ink); text-decoration: none; } a:hover { text-decoration: underline; }
  .nav-bar { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 100; }
  .nav-inner { max-width: 1240px; margin: 0 auto; padding: 10px 24px; display: flex; justify-content: space-between; align-items: center; gap: 16px; }
  .nav-brand-title { font-weight: 700; font-size: 15.5px; color: var(--ink); }
  .nav-tabs-row { display: flex; align-items: center; gap: 6px; }
  .nav-tab { padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--ink-2); border: 1px solid transparent; white-space: nowrap; }
  .nav-tab:hover { background: var(--wash); color: var(--ink); text-decoration: none; }
  .nav-tab.active { background: var(--accent-soft); color: var(--accent-ink); border-color: rgba(217,119,87,.3); }
  .nav-theme-btn { width: 32px; height: 28px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); cursor: pointer; color: var(--ink); }
  .wrap { max-width: 860px; margin: 0 auto; padding: 28px 24px 64px; }
  .hero h1 { font-family: var(--serif); font-size: 28px; font-weight: 500; margin: 0 0 8px; }
  .hero .sub { color: var(--ink-2); font-size: 14.5px; margin: 0 0 6px; }
  .hero .meta { font-size: 12.5px; color: var(--ink-3); }
  .toolbar { display: flex; gap: 10px; align-items: center; margin: 20px 0 14px; flex-wrap: wrap; }
  .toolbar input { flex: 1; min-width: 200px; padding: 7px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--ink); font: inherit; font-size: 13px; }
  .feed { display: flex; flex-direction: column; }
  .item { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 18px; margin-bottom: 10px; }
  .item:hover { border-color: var(--ink-3); }
  .item-top { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--ink-3); margin-bottom: 4px; flex-wrap: wrap; }
  .item-title { font-size: 15px; font-weight: 700; margin: 0 0 4px; color: var(--ink); }
  .item-sum { font-size: 13px; color: var(--ink-2); margin: 0; }
  .tag { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 6px; }
  .t-oc { background: var(--green-soft); color: var(--green); }
  .t-hn { background: var(--accent-soft); color: var(--accent-ink); }
  .foot { margin-top: 24px; font-size: 12.5px; color: var(--ink-3); }
  @media (max-width: 768px) { .wrap { padding: 14px 12px 48px; } .nav-inner { flex-direction: column; align-items: stretch; } }
</style>
</head>
<body>
<header class="nav-bar"><div class="nav-inner">
  <div style="display:flex;justify-content:space-between;align-items:center;">
    <a href="index.html" style="text-decoration:none;"><span class="nav-brand-title">⚡ OpenCode & Free LLM Intel</span></a>
    <button class="nav-theme-btn" id="btnTheme" title="테마 전환">🌙</button>
  </div>
  <nav class="nav-tabs-row">
    <a href="index.html" class="nav-tab">📊 Value Frontier</a>
    <a href="free_models.html" class="nav-tab">🎁 Free Models</a>
    <a href="decisions.html" class="nav-tab">🧭 Decision Models</a>
    <a href="news.html" class="nav-tab active">📰 News</a>
  </nav>
</div></header>

<main class="wrap">
<section class="hero">
  <h1>📰 AI News — 최신순</h1>
  <p class="sub">OpenCode 릴리스·changelog + Hacker News를 한 줄기로 합친 피드입니다. 섹션 구분 없이 날짜 내림차순.</p>
  <div class="meta" id="metaLine">로딩 중…</div>
</section>
<div class="toolbar"><input id="q" type="search" placeholder="필터 (예: nemotron, opencode, luna…)"></div>
<div class="feed" id="feed"></div>
<p class="foot">소스: <a href="https://github.com/sst/opencode/releases" target="_blank" rel="noopener">sst/opencode releases</a> · <a href="https://opencode.ai/changelog" target="_blank" rel="noopener">opencode.ai/changelog</a> · <a href="https://hn.algolia.com" target="_blank" rel="noopener">HN Algolia</a>. 매일 CI에서 재생성됩니다.</p>
</main>

<script src="data/news.js"></script>
<script>
(function(){
  const feed = (window.__NEWS_FEED__ && window.__NEWS_FEED__.items) || [];
  const meta = (window.__NEWS_FEED__ && window.__NEWS_FEED__.meta) || {};
  const $ = id => document.getElementById(id);
  $("metaLine").textContent = "총 " + feed.length + "건 · 수집 " + (meta.fetched_at_utc || "—");
  $("btnTheme").onclick = () => {
    const h = document.documentElement;
    h.dataset.theme = h.dataset.theme === "dark" ? "" : "dark";
    try { localStorage.setItem("theme", h.dataset.theme); } catch(e){}
  };
  try { if (localStorage.getItem("theme") === "dark") document.documentElement.dataset.theme = "dark"; } catch(e){}
  function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
  let q = "";
  $("q").oninput = e => { q = e.target.value.toLowerCase(); render(); };
  function render(){
    const box = $("feed"); box.replaceChildren();
    feed.filter(it => !q || ((it.title+" "+it.summary+" "+it.source).toLowerCase().includes(q))).forEach(it => {
      const d = document.createElement("div");
      d.className = "item";
      const oc = it.source.indexOf("Hacker News") === -1;
      d.innerHTML =
        "<div class='item-top'><span>" + esc(it.date) + "</span>" +
        "<span class='tag " + (oc ? "t-oc" : "t-hn") + "'>" + esc(it.source) + "</span></div>" +
        "<p class='item-title'><a href='" + esc(it.url) + "' target='_blank' rel='noopener'>" + esc(it.title) + "</a></p>" +
        (it.summary ? "<p class='item-sum'>" + esc(it.summary) + "</p>" : "");
      box.appendChild(d);
    });
  }
  render();
})();
</script>
</body>
</html>
